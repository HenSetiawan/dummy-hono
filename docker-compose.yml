# DUMMY-API untuk load test: target curl/k6/gatling di http://localhost:9000
#
#   docker compose -f dummy-api-hono/docker-compose.yml up -d --build
#   curl http://localhost:9000/random/user
#
# Angka RPS tertinggi didapat kalau beban datang dari **network yang sama** (bukan lewat
# port publish / docker-proxy). Jalankan k6 langsung dari VM/network itu (lihat README,
# `k6/rps-items.js`) - bukan lagi dari compose ini.
#
# Clustering lintas container (semua core, beberapa replika berbagi port 9000):
#   services:
#     dummy-api-hono:
#       network_mode: host
#       environment: { API_PROCS: "1", REUSE_PORT: "1" }
#       deploy: { replicas: 4 }
services:
  dummy-api-hono:
    build:
      context: .
      args:
        # Samakan dengan versi Bun lokal bila perlu.
        BUN_VERSION: "1.4.2"
    ports:
      # Host 9000 -> container 9000 (lihat README bila ingin `network_mode: host`).
      - "9000:9000"
    environment:
      PORT: 9000
      # `auto` = jumlah core; SO_REUSEPORT membagi koneksi antar proses (Linux only).
      API_PROCS: auto
      # `auto` = reusePort menyala kalau API_PROCS>1. Untuk clustering lintas container
      # (beberapa replika berbagi port 9000): API_PROCS=1 + REUSE_PORT=1 + network_mode: host.
      REUSE_PORT: auto
      # 0 = tanpa log per request (menyalakannya memotong throughput).
      ACCESS_LOG: 0
    # Throughput tinggi = banyak koneksi bersamaan; default 1024 terlalu kecil.
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Backlog listen yang lebih besar supaya lonjakan koneksi tidak langsung ditolak.
    sysctls:
      net.core.somaxconn: 4096
      net.ipv4.tcp_tw_reuse: 1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    init: true
    stop_grace_period: 10s
    restart: unless-stopped
